[workspace]
resolver = "3"
members = ["crates/openlogs-parser", "crates/openlogs-index", "crates/openlogs-cli", "crates/openlogs-analysis", "crates/openlogs-gamedata", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
memchr = "2.7"
memmap2 = "0.9"
openlogs-analysis = { path = "crates/openlogs-analysis" }
openlogs-gamedata = { path = "crates/openlogs-gamedata" }
openlogs-index = { path = "crates/openlogs-index" }
openlogs-parser = { path = "crates/openlogs-parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
ureq = "3"
